baseURL = "https://granadabus.netlify.app/"
title = "Granada Bus Info"
theme = "PaperMod"
languageCode = "es"               
defaultContentLanguage = "es"
enableRobotsTXT = true
googleAnalytics = "G-M4FBGNGH0P"

[sitemap]
  filename = "sitemap.xml"

[params]
  description = "Bus schedules and stops in Granada Nicaragua"
  disableThemeToggle = true
  disableSpecial1stPost = true
  mainSections = []
  env = "production"

[params.label]
icon = "/images/logo.png"
iconHeight = 100
text = ""
iconOnly = true

[params.analytics.google]
SiteVerificationTag = "8EUzVvYz94iEFCYXT-AvoerPkzyuFLSLyGdM7d0By-w"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


[[menu.main]]
name = "Inicio"
url = "/"
weight = 1

[[menu.main]]
name = "Destinos"
url = "/#destinations"
weight = 2

[[menu.main]]
name = "FAQ"
url = "/faq/"
weight = 3

[[menu.main]]
name = "Contacto"
url = "/contact/"
weight = 4

disableKinds = []

[outputs]
  home = ["HTML", "RSS", "SITEMAP"]
  section = ["HTML"]
  page = ["HTML"]
